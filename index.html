<title>NasiLog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NasiLog">
<style>
body{margin:0}

/* Layout: one calm column on phone; three action tiles side by side on iPad; fixed tab bar at bottom. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --soft:#F2F4F8; --surface:#FFFFFF; --fg:#151E2B; --muted:#5E6A7D; --line:#E6EAF0;
  --feed:#2E6AD6; --feed-soft:#E2EBFB;
  --poop:#9C6610; --poop-soft:#F5EBD8;
  --sleep:#5948C2; --sleep-soft:#E8E5F8;
  --warn:#B93D0B; --warn-soft:#FBE7DC;
  --scrim:rgba(12,18,28,.45);
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Helvetica Neue", system-ui, sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--feed);outline-offset:2px}
.app{max-width:960px;margin:0 auto;padding-inline:18px;padding-block:14px 110px}
.num{font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 18px}
@media (max-width:520px){header.top .datechip{display:none}}
.baby{display:flex;align-items:center;gap:12px;text-align:left;padding:8px 14px 8px 8px;border-radius:20px;background:var(--soft);border:1.5px solid var(--line);min-width:0;max-width:100%;transition:transform .12s ease}
.baby:active{transform:scale(.98)}
.baby .av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--feed);color:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.35rem}
.baby .bt{display:flex;flex-direction:column;gap:1px;min-width:0}
.baby h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.45rem;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.baby .bt span{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.baby .chev{flex:none;margin-left:6px;padding:7px 12px;border-radius:999px;background:var(--fg);color:var(--surface);font-weight:700;font-size:.85rem;white-space:nowrap}
.datechip{color:var(--muted);font-size:.85rem;text-align:right}

.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:.88rem;margin-bottom:14px}

.actions{display:grid;gap:12px}
@media (min-width:700px){.actions{grid-template-columns:repeat(3,1fr)}}
.act{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border-radius:22px;padding:18px 20px;min-height:104px;transition:transform .12s ease}
.act:active{transform:scale(.98)}
@media (min-width:700px){.act{flex-direction:column;align-items:flex-start;min-height:200px;padding:22px}}
.act .ic{flex:none;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:32px;line-height:1;background:var(--surface)!important;box-shadow:0 1px 4px rgba(21,30,43,.08)}
.act .tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.act b{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:-.01em}
.act small{font-size:.9rem;color:var(--muted)}
.act .since{font-size:.95rem;font-weight:600}
.act.feed{background:var(--feed-soft)} .act.feed .ic{background:var(--feed)} .act.feed .since{color:var(--feed)}
.act.poop{background:var(--poop-soft)} .act.poop .ic{background:var(--poop)} .act.poop .since{color:var(--poop)}
.act.sleep{background:var(--sleep-soft)} .act.sleep .ic{background:var(--sleep)} .act.sleep .since{color:var(--sleep)}
.act.sleep.on{background:var(--sleep);color:var(--surface)}
.act.sleep.on .ic{background:var(--surface);color:var(--sleep)}
.act.sleep.on .since{font-family:var(--display);font-size:1.5rem}
.act.sleep.on small,.act.sleep.on .since{color:var(--surface);opacity:.92}

.actcard{display:flex;flex-direction:column;border-radius:22px}
.actcard.feed{background:var(--feed-soft)} .actcard.poop{background:var(--poop-soft)}
.actcard .act{background:transparent!important;flex:1}
.qrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 16px}
.q{background:var(--surface);border:2px solid transparent;border-radius:12px;padding:12px 4px;font-weight:700;font-size:.95rem;color:var(--poop);transition:transform .12s ease}
.actcard.feed .q{color:var(--feed)} .actcard.poop .q{color:var(--poop)}
.q.next{border-color:var(--feed)}
.q small{display:block;font-weight:500;font-size:.72rem;color:var(--muted);margin-top:1px}
.qrow.two{grid-template-columns:1fr 1fr}
.q.stop{background:var(--feed);color:var(--surface)!important}
.actcard.feed.on{box-shadow:inset 0 0 0 2px var(--feed)}
.actcard.feed.on .since{font-family:var(--display);font-size:1.5rem}
.mlin{flex:1;min-width:0;text-align:center;font-family:var(--display);font-size:1.7rem;font-weight:700;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--soft);color:var(--fg)}
.q:active{transform:scale(.96)}
.q.next{border-color:var(--feed)}
.q small{display:block;font-weight:500;font-size:.72rem;color:var(--muted);margin-top:1px}
.minor{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.mini{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left}
.mini span{color:var(--muted);font-size:.85rem;display:block}
.mini>div:first-child{min-width:0}
.mini b{font-weight:600;font-size:1.05rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:430px){.mini{padding:12px}.mini .plus{display:none}.mini b{font-size:.98rem}}
.field textarea{font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--fg);width:100%;min-height:120px;resize:vertical}
.mini .plus{font-size:1.4rem;color:var(--muted);line-height:1}

.today{margin-top:26px}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:16px}
.stat{padding:14px 16px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:700}
.stat span{color:var(--muted);font-size:.85rem}
.stat small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.pastrow{display:flex;justify-content:flex-end;margin-top:6px}
.linkbtn{color:var(--sleep);font-weight:600;font-size:.92rem;padding:8px 4px}
.older{display:block;margin:4px auto 0}
/* trends */
.trends{display:grid;gap:12px}
@media (min-width:700px){.trends{grid-template-columns:1fr 1fr}}
.trend{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 10px;min-width:0}
.trend-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.trend-head h3{margin:0;font-family:var(--display);font-size:1.15rem;font-weight:700}
.trend-head span{color:var(--muted);font-size:.82rem}
.readout{margin:2px 0 6px;font-size:.95rem;font-weight:600}
.trend svg{display:block;width:100%;height:auto;overflow:visible}
.trend .grid{stroke:var(--line);stroke-width:1}
.trend .tick{fill:var(--muted);font-size:10px;font-family:var(--body)}
.trend .tick.sel{fill:var(--fg);font-weight:700}
.trend .hit{fill:transparent;cursor:pointer}
.trend-empty{color:var(--muted);font-size:.9rem;padding:18px 0 12px}

/* history */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.9rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day{margin-bottom:22px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.dayhead h2{margin:0;font-family:var(--display);font-size:1.25rem;font-weight:700}
.dayhead span{color:var(--muted);font-size:.85rem}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;text-align:left}
.row+.row,.row+.rowx,.rowx+.row{border-top:1px solid var(--line)}
.dot{flex:none;width:10px;height:10px;border-radius:50%}
.row .main{flex:1;min-width:0}
.row .main b{font-weight:600;display:block}
.row .main span{color:var(--muted);font-size:.88rem}
.row time{color:var(--muted);font-size:.9rem}
.sesshead{display:flex;align-items:center;gap:12px;padding:12px 16px 4px}
.sesshead .main{flex:1;min-width:0}
.sesshead b{font-weight:700;display:block}
.sesshead span.sum{color:var(--feed);font-size:.88rem;font-weight:600}
.sesshead time{color:var(--muted);font-size:.9rem}
.row.sub{padding-left:38px;padding-block:8px}
.row.sub .main b{font-weight:500;font-size:.95rem}
.sesshead+.row.sub{border-top:0!important}
.row+.sesshead,.rowx+.sesshead{border-top:1px solid var(--line)}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--soft);border:2px solid transparent}
.pitem.cur{border-color:var(--fg);background:var(--surface)}
.pitem .main{flex:1;min-width:0}
.pitem b{display:block;font-weight:700}
.pitem span{color:var(--muted);font-size:.85rem}
.pitem .tag{font-size:.75rem;font-weight:700;color:var(--sleep);white-space:nowrap}
.psec{display:flex;flex-direction:column;gap:8px}
.psec h4{margin:4px 0 0;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.codebox{font-family:ui-monospace,Menlo,monospace;font-size:1.05rem;padding:12px 14px;border-radius:12px;background:var(--soft);user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.linkish{color:var(--feed);font-weight:600;padding:8px 0;text-align:left}
.linkish.warn{color:var(--warn)}
[hidden]{display:none!important}
body.homing .app,body.homing nav.tabs{display:none}
.home{max-width:560px;margin:0 auto;padding-inline:20px;padding-block:44px 48px;display:flex;flex-direction:column;gap:24px}
.home .hlogo{width:88px;height:88px;border-radius:24px;box-shadow:0 6px 18px rgba(21,30,43,.12)}
.home h2{margin:0 0 6px;font-family:var(--display);font-size:2.2rem;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.home .lead{margin:0;color:var(--muted);font-size:1.05rem;line-height:1.45;max-width:42ch}
.famcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);transition:transform .12s ease}
.famcard:active{transform:scale(.98)}
.famcard .fav{flex:none;width:48px;height:48px;border-radius:50%;background:var(--feed);color:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.3rem}
.famcard .main{flex:1;min-width:0}
.famcard b{display:block;font-family:var(--display);font-size:1.2rem}
.famcard .main span{display:block;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.famcard .go{flex:none;padding:7px 12px;border-radius:999px;background:var(--fg);color:var(--surface);font-weight:700;font-size:.85rem}
.hactions{display:flex;flex-direction:column;gap:10px}
.hactions .primary,.hactions .btn{padding:16px;font-size:1.05rem;border-radius:16px;font-weight:700}
/* guide */
.gsearch{width:100%;font:inherit;font-size:1rem;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);color:var(--fg);margin-bottom:14px}
.rtbtn{display:block;width:calc(100% - 32px);margin:0 16px 16px;padding:13px;border-radius:14px;background:var(--feed);color:var(--surface);font-weight:700;font-size:1rem}
.rtsteps{display:flex;flex-direction:column;gap:0;counter-reset:rt}
.rtstep{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.rtstep:last-child{border-bottom:0}
.rtnum{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--soft);color:var(--muted);border:2px solid var(--line)}
.rtstep.now .rtnum{background:var(--feed);color:var(--surface);border-color:var(--feed)}
.rtstep.done .rtnum{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.rtbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rtbody b{font-size:1rem}
.rtbody small{color:var(--muted);font-size:.85rem;line-height:1.35}
.rtstep.done .rtbody b{text-decoration:line-through;color:var(--muted)}
.rtacts{display:flex;flex-wrap:wrap;gap:6px}
.rtacts button{padding:8px 12px;border-radius:10px;font-weight:700;font-size:.88rem;background:var(--soft)}
.rtacts button.go{background:var(--feed);color:var(--surface)}
.rtacts button.stop{background:var(--fg);color:var(--surface)}
.rtdue{background:var(--feed-soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.gregion{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.gregion span{font-size:.85rem;color:var(--muted);font-weight:600}
.gregion .chips{margin:0;padding:0;flex-wrap:wrap;overflow:visible}
.ghelp{border-radius:18px;background:var(--warn-soft);padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.ghelp h3{margin:0;font-family:var(--display);font-size:1.15rem;color:var(--warn)}
.ghelp ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.glines{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:18px}
.gline{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.gline b{display:block;font-family:var(--display);font-size:1.25rem}
.gline span{color:var(--muted);font-size:.82rem;line-height:1.3;display:block}
.gsec{margin-bottom:20px}
.gsec>h2{margin:0 0 8px;font-family:var(--display);font-size:1.25rem}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;overflow:hidden}
.gcard summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.gcard summary::-webkit-details-marker{display:none}
.gcard summary::after{content:"+";font-size:1.3rem;color:var(--muted);font-weight:500}
.gcard[open] summary::after{content:"−"}
.gcard .gb{padding:0 16px 14px;font-size:.95rem;line-height:1.5;display:flex;flex-direction:column;gap:8px}
.gcard .gb p{margin:0}
.gcard .gb ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.gcard table{border-collapse:collapse;width:100%;font-size:.88rem}
.gcard th,.gcard td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.gcard th{color:var(--muted);font-weight:600}
.gtw{overflow-x:auto}
.gyou{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.gsrc{font-size:.82rem;color:var(--muted)}
.gsrc a,.gb a{color:var(--feed)}
.gfoot{font-size:.82rem;color:var(--muted);line-height:1.45;margin-top:8px}
.rowx{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 12px}
.btn{padding:9px 16px;border-radius:12px;font-weight:600;font-size:.92rem;background:var(--soft)}
.btn.danger{background:var(--warn);color:var(--surface)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:1.15rem;margin-bottom:4px}
.fever{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:.75rem;font-weight:700}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{flex:1;max-width:220px;padding:10px;border-radius:12px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--fg);background:var(--soft)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-height:92%;overflow-y:auto}
@media (min-width:700px){.sheet{border-radius:24px}}
.sheet h3{margin:0;font-family:var(--display);font-size:1.5rem}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--soft);padding:4px;border-radius:14px}
.seg button{padding:12px 6px;border-radius:10px;font-weight:600;font-size:.95rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;color:var(--muted);font-weight:600}
.field input{font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--fg);width:100%}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:14px;background:var(--soft);font-size:1.4rem;font-weight:600}
.stepper output{flex:1;text-align:center;font-family:var(--display);font-size:1.7rem;font-weight:700}
.note{font-size:.85rem;color:var(--muted);margin:0}
.note.warn{color:var(--warn)}
.sheetbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.primary{padding:15px;border-radius:14px;font-weight:700;font-size:1.05rem;color:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 8px 8px 16px;min-height:44px;border-radius:14px;font-size:.92rem;font-weight:600;z-index:20;width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px}
.toastbtn{background:var(--bg);color:var(--fg);padding:8px 12px;border-radius:10px;font-weight:700;font-size:.88rem;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.act{transition:none}}
</style>
</head>
<body>


<main class="home" id="home" hidden></main>
<div class="app">
  <header class="top">
    <button class="baby" id="babyBtn" aria-label="Switch baby or family"><span class="av" id="babyAv" aria-hidden="true">B</span><span class="bt"><h1 id="babyName">Baby</h1><span id="babyAge">Tap to add name and birthday</span></span><span class="chev">Switch ▾</span></button>
    <div class="datechip num" id="clock"></div>
  </header>
  <div id="banner" class="banner" hidden></div>

  <main id="viewToday">
    <div class="actions">
      <div class="actcard feed"><button class="act feed" id="actFeed"><div class="ic" aria-hidden="true">🍼</div><div class="tx"><b>Feed</b><span class="since" id="feedSince">No feeds yet</span><small id="feedLast">Tap to log</small></div></button>
        <div class="qrow" id="feedQ" role="group" aria-label="Feed"></div>
        <button class="rtbtn" id="rtOpen">▶ Feeding routine (step by step)</button></div>
      <div class="actcard poop"><button class="act poop" id="actPoop"><div class="ic" aria-hidden="true">💩</div><div class="tx"><b>Poop</b><span class="since" id="poopSince">No changes yet</span><small id="poopLast">Tap to log</small></div></button>
        <div class="qrow" id="poopQ" role="group" aria-label="Log a diaper in one tap"><button class="q" data-v="wet">Wet</button><button class="q" data-v="dirty">Dirty</button><button class="q" data-v="both">Both</button></div></div>
      <button class="act sleep" id="actSleep"><div class="ic" aria-hidden="true">😴</div><div class="tx"><b id="sleepLabel">Sleep</b><span class="since" id="sleepSince">No sleeps yet</span><small id="sleepLast">Tap when baby falls asleep</small></div></button>
    </div>
    <div class="minor">
      <button class="mini" id="actWeight"><div><span>Weight</span><b class="num" id="weightLast">Add</b></div><div class="plus" aria-hidden="true">+</div></button>
      <button class="mini" id="actTemp"><div><span>Temp</span><b class="num" id="tempLast">Add</b></div><div class="plus" aria-hidden="true">+</div></button>
      <button class="mini" id="actNote"><div><span>Note</span><b class="num" id="noteLast">Add</b></div><div class="plus" aria-hidden="true">+</div></button>
    </div>
    <div class="pastrow"><button class="linkbtn" id="addPastSleep">+ Add a past sleep</button></div>
    <section class="today">
      <p class="label">Today so far</p>
      <div class="stats">
        <div class="stat"><b class="num" id="stFeeds">0</b><span>Feeds</span></div>
        <div class="stat"><b class="num" id="stDiapers">0</b><span>Diapers</span><small class="num" id="stSplit"></small></div>
        <div class="stat"><b class="num" id="stSleep">0h</b><span>Sleep</span></div>
      </div>
    </section>
  </main>

  <main id="viewTrends" hidden>
    <p class="label">Last 7 days</p>
    <div class="trends" id="trendsBox"></div>
  </main>

  <main id="viewGuide" hidden>
    <input class="gsearch" id="gSearch" type="search" placeholder="Search the guide: fever, latch, jaundice…" aria-label="Search the guide" autocomplete="off">
    <div id="guideBox"></div>
  </main>

  <main id="viewHistory" hidden>
    <div class="chips" id="chips" role="group" aria-label="Filter"></div>
    <div id="historyList"></div>
  </main>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" id="tabToday" aria-selected="true">Today</button>
  <button role="tab" id="tabTrends" aria-selected="false">Trends</button>
  <button role="tab" id="tabHistory" aria-selected="false">History</button>
  <button role="tab" id="tabGuide" aria-selected="false">Guide</button>
</nav>
<div id="sheetRoot"></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let family=null, families=[], babyId=null, feedTimer=null, db=null, histLimit=1500, moreAvailable=false, entries=[], sleepStart=null, baby={}, tab="today", filter="all", openRow=null, confirmRow=null;

/* ---------- formatting ---------- */
const MIN=60000, HR=3600000, DAY=86400000;
function dur(ms){ms=Math.max(0,ms);const h=Math.floor(ms/HR),m=Math.floor(ms%HR/MIN);return h?`${h}h ${m}m`:`${m}m`;}
function ago(t){const d=Date.now()-t;return d<MIN?"Just now":dur(d)+" ago";}
function hhmm(t){return new Date(t).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});}
function dayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function dayName(t){const s=dayStart(t),n=dayStart(Date.now());if(s===n)return"Today";if(s===n-DAY)return"Yesterday";return new Date(t).toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"});}
function localInput(t){const d=new Date(t-new Date(t).getTimezoneOffset()*MIN);return d.toISOString().slice(0,16);}
function fromInput(v){const t=new Date(v).getTime();return isNaN(t)?Date.now():t;}
const kgToLb=kg=>kg*2.20462;
function weightText(kg){const lb=kgToLb(kg),whole=Math.floor(lb),oz=Math.round((lb-whole)*16);return `${kg.toFixed(2)} kg (${whole} lb ${oz} oz)`;}

function describe(e){
  if(e.type==="feed"){
    if(!e.method) return {title:"Feed", detail:"Tap to add details"};
    if(e.method==="bottle") return {title:"Bottle", detail:`${e.amount||0} mL ${e.milk==="formula"?"formula":"breast milk"}`};
    return {title:e.method==="left"?"Breast, left":"Breast, right", detail:e.minutes?`${e.minutes} min`:"Breastfeed"};
  }
  if(e.type==="poop"){
    if(!e.kind) return {title:"Poop", detail:"Tap to add details"};
    return {title:e.kind==="wet"?"Wet diaper":e.kind==="dirty"?"Dirty diaper":"Wet + dirty", detail:"Diaper change"};
  }
  if(e.type==="sleep") return {title:"Sleep", detail:`${dur(e.end-e.at)}, until ${hhmm(e.end)}`};
  if(e.type==="weight") return {title:"Weight", detail:weightText(e.kg)};
  if(e.type==="note") return {title:"Note", detail:e.text||""};
  if(e.type==="temp") return {title:"Temperature", detail:`${e.c.toFixed(1)} °C`, fever:e.c>=38};
  return {title:e.type,detail:""};
}
const colorOf={feed:"var(--feed)",poop:"var(--poop)",sleep:"var(--sleep)",weight:"var(--muted)",temp:"var(--warn)",note:"var(--fg)"};

/* ---------- render ---------- */
function latest(type){return entries.find(e=>e.type===type);}
function sleepIn(from,to){let ms=0;for(const e of entries){if(e.type!=="sleep")continue;ms+=Math.max(0,Math.min(e.end,to)-Math.max(e.at,from));}
  if(sleepStart) ms+=Math.max(0,Math.min(Date.now(),to)-Math.max(sleepStart,from));return ms;}

function renderToday(){
  $("clock").textContent=new Date().toLocaleDateString([], {weekday:"long",month:"short",day:"numeric"});
  $("babyName").textContent=baby.name||"Baby";
  if(baby.born){const days=Math.floor((dayStart(Date.now())-dayStart(baby.born))/DAY);
    $("babyAge").textContent=days<0?"Due soon":days<14?`${days} day${days===1?"":"s"} old`:days<84?`${Math.floor(days/7)} weeks old`:`${Math.floor(days/30.44)} months old`;}
  else $("babyAge").textContent="Tap to add name and birthday";
  if(family)$("babyAge").textContent+=` · ${family.name}`;
  $("babyAv").textContent=((baby.name||"Baby").replace(/^baby\s+/i,"").trim()[0]||"B").toUpperCase();

  const f=latest("feed");
  const fs=feedSessions(),ls=fs[fs.length-1];
  $("feedSince").textContent=ls?ago(ls.at):"No feeds yet";
  const lb=entries.find(e=>e.type==="feed"&&e.method);
  const next=lb&&lb.method!=="bottle"?` · Next: ${lb.method==="left"?"Right":"Left"}`:"";
  $("feedLast").textContent=(f?(f.method?`${describe(f).title}${f.method==="bottle"||f.minutes?` · ${describe(f).detail}`:""} at ${hhmm(f.at)}`:`Logged at ${hhmm(f.at)}`):"Tap to log a feed")+next;
  const fc=$("actFeed").parentElement,fq=$("feedQ");
  if(feedTimer){const side=feedTimer.side==="left"?"Left":"Right",other=feedTimer.side==="left"?"Right":"Left";
    fc.classList.add("on");$("feedSince").textContent=mmss(Date.now()-feedTimer.start);
    $("feedLast").textContent=timerLine();
    fq.className="qrow two";fq.innerHTML=`<button class="q" data-a="switch">Switch to ${other}</button><button class="q stop" data-a="stop">Stop</button>`;}
  else{fc.classList.remove("on");const lbt=entries.find(e=>e.type==="feed"&&e.method==="bottle"),nx=lb&&lb.method!=="bottle"?(lb.method==="left"?"right":"left"):"";
    fq.className="qrow";fq.innerHTML=`<button class="q${nx==="left"?" next":""}" data-v="left">Left<small>start timer</small></button><button class="q${nx==="right"?" next":""}" data-v="right">Right<small>start timer</small></button><button class="q" data-v="bottle">Bottle<small>30 mL</small></button>`;}
  const p=latest("poop");
  $("poopSince").textContent=p?ago(p.at):"None logged yet";
  $("poopLast").textContent=p?(p.kind?`${describe(p).title} at ${hhmm(p.at)}`:`Logged at ${hhmm(p.at)} · tap to log`):"One tap logs a diaper";

  const sb=$("actSleep");
  if(sleepStart){sb.classList.add("on");$("sleepLabel").textContent="Asleep";
    $("sleepSince").textContent=mmss(Date.now()-sleepStart);$("sleepLast").textContent=`Since ${hhmm(sleepStart)} · tap when awake`;}
  else{sb.classList.remove("on");$("sleepLabel").textContent="Sleep";const s=latest("sleep");
    $("sleepSince").textContent=s?`Awake ${dur(Date.now()-s.end)}`:"No sleeps yet";
    $("sleepLast").textContent=s?`Last nap ${dur(s.end-s.at)} · tap to start`:"Tap when baby falls asleep";}

  const w=latest("weight");$("weightLast").textContent=w?`${w.kg.toFixed(2)} kg`:"Add";
  const t=latest("temp");$("tempLast").textContent=t?`${t.c.toFixed(1)} °C`:"Add";
  const nt=latest("note");$("noteLast").textContent=nt?ago(nt.at):"Add";

  const s0=dayStart(Date.now()),s1=s0+DAY;
  $("stFeeds").textContent=fs.filter(x=>x.at>=s0).length;
  const dz=entries.filter(e=>e.type==="poop"&&e.at>=s0);
  $("stDiapers").textContent=dz.length;
  const wet=dz.filter(e=>e.kind==="wet"||e.kind==="both").length,dirty=dz.filter(e=>e.kind==="dirty"||e.kind==="both").length;
  $("stSplit").textContent=dz.length?`${wet} wet · ${dirty} dirty`:"";
  $("stSleep").textContent=dur(sleepIn(s0,s1));
}

const FILTERS=[["all","All"],["feed","Feeds"],["poop","Diapers"],["sleep","Sleep"],["weight","Weight"],["temp","Temperature"],["note","Notes"]];
function renderHistory(){
  $("chips").innerHTML=FILTERS.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("");
  const list=entries.filter(e=>filter==="all"||e.type===filter);
  if(!list.length){$("historyList").innerHTML=`<div class="empty"><b>Nothing logged yet</b>Entries from Feed, Poop, Sleep, Weight, Temp and Notes show up here, grouped by day.</div>`;return;}
  const groups=new Map();

function barCard(key,title,vals,days,color,fmt,avgTxt,unit=""){

  g+=`<text class="tick" x="${pl-6}" y="${pt+3}" text-anchor="end">${tickTxt(max)}${unit}</text><text class="tick" x="${pl-6}" y="${pt+ch+3}" text-anchor="end">0</text>`;
  vals.forEach((v,i)=>{

function weightCard(){

  if(pts.length<2)return `<section class="trend"><div class="trend-head"><h3>Weight</h3><span>All weigh-ins</span></div><p class="trend-empty">Add at least two weigh-ins to see the trend.</p></section>`;

}

        if(cur)setEntry(cur.id,obj);else addEntry(obj);closeSheet();toast("Note saved");};
    });
}
function sleepSheet(cur){
  const now=Date.now(),st=cur?cur.at:now-HR,en=cur?cur.end:now;
  openSheet(`<h3>${cur?"Edit sleep":"Add a past sleep"}</h3>
    <div class="field"><label for="fStart">Fell asleep</label><input type="datetime-local" id="fStart"></div>
    <div class="field"><label for="fEnd">Woke up</label><input type="datetime-local" id="fEnd"></div>
    <p class="note num" id="sDur"></p>
    ${btns("var(--sleep)",cur?"Save sleep":"Add sleep")}`,()=>{
      $("fStart").value=localInput(st);$("fEnd").value=localInput(en);
      const upd=()=>{const a=fromInput($("fStart").value),b=fromInput($("fEnd").value);$("sDur").textContent=b>a?`Duration: ${dur(b-a)}`:"Wake time must be after the sleep time.";};
      upd();$("fStart").oninput=upd;$("fEnd").oninput=upd;
      $("fSave").onclick=()=>{const a=fromInput($("fStart").value),b=fromInput($("fEnd").value);
        if(!(b>a)){toast("Wake time must be after the sleep time");return;}
        if(b-a>16*HR){toast("That's over 16 hours. Check the times.");return;}
        if(b>Date.now()+MIN){toast("Wake time can't be in the future");return;}
        const obj={type:"sleep",at:a,end:b};if(cur)setEntry(cur.id,obj);else addEntry(obj);closeSheet();toast(cur?"Sleep updated":"Sleep added");};
    });
}
function weightSheet(cur){
  let unit="kg";const w=cur||latest("weight");
  openSheet(`<h3>Weight</h3>${seg("u",[["kg","kg"],["lb","lb"]],unit)}
    <div class="field"><label for="fW" id="wLab">Weight in kg</label><input id="fW" type="number" inputmode="decimal" step="0.01" min="0.5" max="30" placeholder="${w?w.kg.toFixed(2):"3.40"}"></div>
    ${timeField}${btns("var(--fg)","Save weight")}`, root=>{
      $("fTime").value=localInput(cur?cur.at:Date.now());if(cur)$("fW").value=cur.kg.toFixed(2);
      bindSeg(root,"u",v=>{if(v!==unit){const cv=parseFloat($("fW").value);if(cv>0)$("fW").value=(v==="lb"?kgToLb(cv):cv/2.20462).toFixed(2);}unit=v;$("wLab").textContent=`Weight in ${v}`;$("fW").placeholder=v==="kg"?(w?w.kg.toFixed(2):"3.40"):(w?kgToLb(w.kg).toFixed(2):"7.50");});
      $("fSave").onclick=()=>{const v=parseFloat($("fW").value);if(!(v>0)){toast("Enter a weight first");return;}
        const kg=unit==="kg"?v:v/2.20462;const obj={type:"weight",kg:Math.round(kg*1000)/1000,at:fromInput($("fTime").value)};
        if(cur)setEntry(cur.id,obj);else addEntry(obj);closeSheet();toast(cur?"Weight updated":"Weight logged");};
    });
}
function tempSheet(cur){
  openSheet(`<h3>Temperature</h3>
    <div class="field"><label for="fT">Temperature in °C</label><input id="fT" type="number" inputmode="decimal" step="0.1" min="33" max="43" placeholder="36.8"></div>
    <p class="note" id="tNote">Normal for a newborn is about 36.5 to 37.5 °C.</p>
    ${timeField}${btns("var(--warn)","Save temperature")}`, root=>{
      $("fTime").value=localInput(cur?cur.at:Date.now());if(cur)$("fT").value=cur.c.toFixed(1);
      $("fT").addEventListener("input",()=>{const v=parseFloat($("fT").value),n=$("tNote");
        if(v>=38){n.className="note warn";n.textContent="38.0 °C or higher in a baby under 3 months: call your doctor or go to emergency now.";}
        else{n.className="note";n.textContent="Normal for a newborn is about 36.5 to 37.5 °C.";}});
      $("fSave").onclick=()=>{const v=parseFloat($("fT").value);if(!(v>30&&v<45)){toast("Enter a temperature first");return;}
        const obj={type:"temp",c:Math.round(v*10)/10,at:fromInput($("fTime").value)};if(cur)setEntry(cur.id,obj);else addEntry(obj);closeSheet();toast(v>=38?"Saved. 38 °C or higher: call your doctor.":"Temperature logged");};
    });
}

function detectRegion(){
  try{const r=localStorage.getItem("nasiRegion");if(r&&REGIONS[r])return r;}catch(e){}
  let tz="";try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"";}catch(e){}
  if(/^Asia\/(Dubai|Muscat)$/.test(tz))return "dxb";
  if(/^America\/(Vancouver|Dawson_Creek|Fort_Nelson|Creston)$/.test(tz))return "bc";
  return "on";
}

const src=(...k)=>`<p class="gsrc">Source: ${k.map(x=>`<a href="${SRC[x][1]}" target="_blank" rel="noopener">${SRC[x][0]}</a>`).join(" · ")}</p>`;
const more=(path,label="Read more on Healthy Parents, Healthy Children")=>`<p class="gsrc"><a href="${HP}${path}" target="_blank" rel="noopener">${label} ›</a></p>`;
const GUIDE=[
 {sec:"Feeding",cards:[
  {t:"Feeding your newborn",b:`<ul><li>Feed on demand, whenever your baby shows hunger, not on a strict schedule.</li><li>Breastfed newborns feed at least 8 times in 24 hours. In the first few days you may need to wake a sleepy baby to feed.</li><li>A feed, including a diaper change, often takes 45 to 60 minutes at first.</li><li>Cluster feeding (many feeds close together, often in the evening and overnight) is normal.</li><li>Breastfed babies need a vitamin D supplement of 400 IU every day.</li></ul>${src("wdg","bcFeed")}${more("/im-a-parent/newborn-birth-2-months/feeding-your-newborn")}`},
  {t:"A typical feeding routine (early days)",b:`<ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px"><li>First breast, about 15 minutes (start on the side due next).</li><li>Burp.</li><li>Check and change the diaper if wet or dirty.</li><li>Second breast, about 15 minutes.</li><li>Burp again.</li><li>Formula top-up of 15 to 60 mL (60 mL max), only if it's part of your feeding plan.</li><li>Settle baby on their back in their own crib.</li></ol><p>Offer feeds at least 8 times in 24 hours, about every 3 hours or sooner if baby shows hunger. Follow your health care provider's advice on top-ups, since amounts depend on your baby's age, weight and feeding.</p><p>Tap <b>Feeding routine</b> on the Today screen to be walked through these steps and log them as you go.</p>${src("wdg","hcSleep")}`},
  {t:"Is my baby getting enough? Diaper counts",live:"diapers",b:`<p>Minimum wet diapers and poops in 24 hours for a breastfed baby:</p><div class="gtw"><table><tr><th>Day of life</th><th>Wet</th><th>Poops</th><th>Poop colour</th></tr><tr><td>1 to 2</td><td>1 to 2</td><td>1 to 2</td><td>Dark green or black, sticky</td></tr><tr><td>3</td><td>3</td><td>3</td><td>Brown, green or yellow</td></tr><tr><td>4 to 5</td><td>4 heavy</td><td>3</td><td>Yellow</td></tr><tr><td>5 and up</td><td>5 to 8 heavy</td><td>3 (first month)</td><td>Yellow, seedy</td></tr></table></div><div class="gyou" id="gDiaperLive"></div><p><b>Get help if</b> there's no poop for over 12 hours in the first week, few wet diapers or pink crystals after day 3, dark green or black poop after day 5, or your baby falls asleep after only a few minutes at the breast.</p>${src("wdg")}`},
  {t:"Breastfeeding challenges",b:`<p>Challenges are common in the first few weeks, and you're not alone.</p><ul><li>A good latch feels like a pulling sensation, not pain.</li><li>If you have pain in your breasts or nipples, bruising, blisters or cracks, get help as soon as possible.</li><li>For support, {{NURSE}} or talk with your health care provider.</li></ul><p class="gsrc">Source: Alberta Health Services, Guide to the Early Days</p>${more("/im-a-parent/feeding-your-baby/breastfeeding-challenges-and-what-to-do")}`},
  {t:"Breastmilk supply",b:`<p>How breastmilk supply works, and what to do if you're worried about it.</p>${more("/im-a-parent/feeding-your-baby/breastfeeding-basics")}`},
  {t:"Expressing breastmilk by hand",b:`<p>Step-by-step guide and video for hand expressing and storing breastmilk.</p>${more("/im-a-parent/feeding-your-baby/expressed-breastmilk")}`},
  {t:"Feeding equipment: cleaning and preparing",b:`<p>Printable guides on cleaning bottles and pump parts and preparing formula safely.</p>${more("/resources/printables-healthy-eating","Open the printables")}`},
 ]},
 {sec:"Caring for your newborn",cards:[
  {t:"Taking your baby's temperature and fever",b:`<p>For babies under 2 years, a rectal temperature is most accurate. Under the arm (armpit) is the alternative.</p><div class="gtw"><table><tr><th>Method</th><th>Normal range</th></tr><tr><td>Rectal</td><td>36.6 to 37.9 °C</td></tr><tr><td>Armpit</td><td>36.5 to 37.5 °C</td></tr></table></div><p><b>A reading above the normal range is a fever. A baby under 3 months with a fever needs to be seen by a doctor urgently.</b></p>${src("cpsFever")}${more("/resources/videos-injury-prevention-and-staying-healthy","Video: taking a temperature under the arm")}${more("/im-a-parent/newborn-birth-2-months/how-your-newborn-looks")}`},
  {t:"Jaundice (yellow skin)",b:`<p>Jaundice is very common in newborns. It's usually noticed 1 to 4 days after birth, first on the face and chest, and most of the time it goes away on its own. Watch the skin and the whites of the eyes.</p><p><b>Call your doctor if your baby:</b></p><ul><li>refuses breast or bottle feeding</li><li>is very sleepy all the time</li><li>has lost more than 10% of their birth weight</li><li>has arms and legs that look yellow or orange</li><li>has jaundice that seems to be getting worse</li></ul>${src("cpsJaun")}${more("/im-a-parent/newborn-birth-2-months/how-your-newborn-looks")}`},
  {t:"Milestones: birth to 2 months",b:`<p>By about 2 months, most babies:</p><ul><li>begin to smile at people and look at their parents</li><li>coo and turn their head toward sounds</li><li>pay attention to faces and begin to follow things with their eyes</li><li>hold their head up and begin to push up during tummy time</li></ul><p>Talk with your baby's health care provider about milestones at every visit.</p>${src("ms")}${more("/im-a-parent/newborn-birth-2-months/your-newborn-babys-development")}`},
  {t:"Skin-to-skin and cuddling",b:`<p>Why skin-to-skin contact and cuddling matter in the early weeks, and how to do it.</p>${more("/im-a-parent/newborn-birth-2-months/growing-learning-together")}`},
  {t:"Serve-and-return: building your baby's brain",b:`<p>When your baby coos, looks or cries and you respond with words, eye contact or a smile, you're building their brain. These back-and-forth moments matter from day one.</p>${more("/im-a-parent/newborn-birth-2-months/your-newborn-babys-development")}`},
 ]},
 {sec:"Keeping your baby safe",cards:[
  {t:"Safe sleep",b:`<ul><li>Always put your baby on their back to sleep, for naps and at night, in a crib, cradle or bassinet.</li><li>Keep the crib empty except for a firm mattress and a fitted sheet. No pillows, quilts, bumper pads, toys or sleep positioners.</li><li>Share a room for the first 6 months, with the crib within arm's reach of your bed. Bed sharing is not recommended.</li><li>Never let your baby sleep on a couch, armchair, adult bed or air mattress.</li><li>Don't let your baby sleep for long in a car seat, stroller or swing. Move them to their crib.</li><li>Don't overheat the room, and keep your home smoke-free.</li></ul>${src("hcSleep")}${more("/im-a-parent/newborn-birth-2-months/safe-sleep-preventing-injuries")}${more("/resources/tools/safe-sleep-safe-crib","Interactive tool: safe sleep, safe crib")}`},
  {t:"Car seat safety: the YES test",b:`<p>Use a rear-facing seat in the back seat, never in front of an airbag, approved for use where you live (in Canada, look for the CMVSS label). Each trip, check:</p><ul><li>Harness straps are at or just below your baby's shoulders.</li><li>The chest clip is at armpit level.</li><li>Straps lie flat with no twists.</li><li>The harness is snug: you can't pinch a fold in the strap.</li><li>The carry handle is in the travel position.</li></ul><p>Register your seat and check for recalls.</p>${src("yes")}${more("/im-a-parent/healthy-growing-families/healthy-homes-and-preventing-injuries")}`},
  {t:"Coping with crying",b:`<p>Crying often increases at about 2 weeks and peaks at about 2 months. Some babies have fussy spells of 3 to 6 hours, often in the evening.</p><p><b>Things to try:</b> feed and burp, change the diaper, hold skin-to-skin, rock or walk, adjust clothing layers, sing or talk softly, dim the lights.</p><p><b>Make a crying plan.</b> If you feel frustrated or unable to cope, put your baby down somewhere safe like their crib, and call someone you trust for help.</p><p><b>Never shake or hit a baby.</b> Shaking can cause brain damage or death.</p><p class="gsrc">Source: Alberta Health Services, Guide to the Early Days · <a href="https://www.simcoemuskokahealth.org/docs/default-source/topic-childhealth/why-do-babies-cry.pdf">Simcoe Muskoka Health: Why do babies cry?</a></p>${more("/im-a-parent/newborn-birth-2-months/everyday-care-sleeping-crying")}`},
 ]},
 {sec:"Caring for yourself",cards:[
  {t:"Warning signs after birth",b:`<p><b>Call {{EMERG}} or go to emergency for:</b></p><ul><li>chest pain, trouble breathing, a seizure or collapse</li><li>bleeding that soaks a pad every hour for 2 hours or more</li><li>feeling very weak, dizzy or faint</li><li>thoughts of harming yourself, your baby or others</li></ul><p><b>Call your health care provider right away, or {{NURSE}}, for:</b> clots bigger than a golf ball, bleeding that increases or smells bad, fever over 38 °C, a red or painful incision or stitches, headaches or vision changes, a red, swollen, painful leg, or breast pain or redness that feeding doesn't relieve.</p><p>Some warning signs can appear up to a year after birth.</p>${src("pp")}${more("/im-pregnant/postpartum/caring-for-yourself")}`},
  {t:"Baby blues and postpartum mental health",b:`<p>Baby blues often start in the first few days, peak around day 4, and ease within about 2 weeks. Postpartum depression affects up to 15 in 100 birthing parents, and partners can be affected too.</p><p><b>Get help if</b> low mood or anxiety lasts more than 2 weeks, or you feel life isn't worth living. {{MH}}</p>${src("blues")}${more("/im-pregnant/postpartum/mental-health-2")}${more("/resources/printables-pregnancy-labour-and-postpartum","Printables: self-care, mental health sheet, family support plan")}`},
  {t:"Birth control and sex after birth",b:`<p>You can get pregnant before your period returns. Talk with your provider about birth control options.</p>${more("/im-pregnant/postpartum/birth-control")}`},
 ]},
 {sec:"Checkups and vaccines",cards:[
  {t:"Vaccines and your baby's checkups",b:`{{VAX}}<p>Your provider will also check your baby's growth and development at each visit.</p>`},
 ]},
];

/* ---------- guided feeding routine ---------- */
let rt=null,rtOpenNow=false;
function rtKey(){return "nasiRoutine:"+(babyId||"x");}
function rtLoad(){try{rt=JSON.parse(localStorage.getItem(rtKey())||"null");}catch(e){rt=null;}if(rt&&Date.now()-rt.start>4*HR)rt=null;}
function rtSave(){try{rt?localStorage.setItem(rtKey(),JSON.stringify(rt)):localStorage.removeItem(rtKey());}catch(e){}}
function rtSince(pred){return rt&&entries.some(e=>e.at>=rt.start-MIN&&pred(e));}
function openRoutine(){
  rtLoad();
  if(!rt){const lb=entries.find(e=>e.type==="feed"&&(e.method==="left"||e.method==="right"));
    const first=lb?(lb.method==="left"?"right":"left"):"right";
    rt={start:Date.now(),first,second:first==="left"?"right":"left",burp1:false,burp2:false,dry:false,settle:false,skipTop:false};rtSave();}
  rtOpenNow=true;renderRoutine(true);
}
function rtSide(side){return side==="left"?"Left":"Right";}
function renderRoutine(fresh){
  if(!rt){rtOpenNow=false;return;}
  const fs=feedSessions(),last=fs[fs.length-1];
  const s1=rtSince(e=>e.type==="feed"&&e.method===rt.first),s2=rtSince(e=>e.type==="feed"&&e.method===rt.second);
  const run1=feedTimer&&feedTimer.side===rt.first,run2=feedTimer&&feedTimer.side===rt.second;
  const dia=rtSince(e=>e.type==="poop")||rt.dry,top=rtSince(e=>e.type==="feed"&&e.method==="bottle")||rt.skipTop;
  const steps=[
    {done:s1&&!run1,t:`${rtSide(rt.first)} breast, about 15 min`,d:`Starts on the side due next. A good latch feels like pulling, not pain.`,
      a:run1?`<button class="stop" data-rt="stop1">Stop · <span class="num rtTimer"></span></button><button data-rt="switch">Switch to ${rtSide(rt.second)}</button>`:(s1?"":`<button class="go" data-rt="start1">Start ${rtSide(rt.first)} timer</button>`)},
    {done:rt.burp1,t:"Burp",d:"Hold baby upright against your shoulder or sitting on your lap, and gently pat or rub the back.",a:rt.burp1?"":`<button data-rt="burp1">Done</button>`},
    {done:dia,t:"Check the diaper",d:"Log what you find.",
      a:dia?"":`<button data-rt="wet">Wet</button><button data-rt="dirty">Dirty</button><button data-rt="both">Both</button><button data-rt="dry">Dry, no change</button>`},
    {done:s2&&!run2,t:`${rtSide(rt.second)} breast, about 15 min`,d:"",
      a:run2?`<button class="stop" data-rt="stop2">Stop · <span class="num rtTimer"></span></button>`:(s2?"":`<button class="go" data-rt="start2">Start ${rtSide(rt.second)} timer</button>`)},
    {done:rt.burp2,t:"Burp again",d:"",a:rt.burp2?"":`<button data-rt="burp2">Done</button>`},
    {done:top,t:"Formula top-up, 15 to 60 mL",d:"Only if part of your feeding plan. 60 mL max. Stop when baby shows they're full.",
      a:top?"":`<button class="go" data-rt="bottle">Log top-up</button><button data-rt="skiptop">Not needed</button>`},
    {done:rt.settle,t:"Settle baby on their back",d:"For sleep, always on their back in their own crib or bassinet, with nothing else in it.",a:rt.settle?"":`<button data-rt="settle">Done</button>`},
  ];
  const nowIdx=steps.findIndex(x=>!x.done);
  const dueLine=last?`Last feed started at ${hhmm(last.at)}. Newborns feed at least 8 times in 24 hours, so offer the next feed by about <b>${hhmm(last.at+3*HR)}</b>, or sooner if baby shows hunger. Wake a sleepy baby if needed in the first days.`:`Newborns feed at least 8 times in 24 hours, about every 3 hours or sooner if baby shows hunger.`;
  const html=`<h3>Feeding routine</h3>
    <div class="rtdue">${dueLine}</div>
    <div class="rtsteps">${steps.map((x,i)=>`<div class="rtstep${x.done?" done":""}${i===nowIdx?" now":""}"><span class="rtnum">${x.done?"✓":i+1}</span><div class="rtbody"><b>${x.t}</b>${x.d?`<small>${x.d}</small>`:""}${x.a&&!x.done?`<div class="rtacts">${x.a}</div>`:""}</div></div>`).join("")}</div>
    <p class="note">Each step is logged to ${esc(baby.name||"your baby")}'s history as you go. Vitamin D: breastfed babies need 400 IU a day.</p>
    <div class="sheetbtns"><button class="btn" id="rtClose">Close</button><button class="primary" id="rtFinish" style="background:var(--fg)">${nowIdx===-1?"Finish routine":"End routine"}</button></div>`;
  if(fresh||!document.getElementById("rtFinish"))openSheet(html,bindRoutine);
  else{const sh=document.querySelector(".sheet");const y=sh.scrollTop;sh.innerHTML=html;bindRoutine(sh);sh.scrollTop=y;}
  rtTick();
}
function rtTick(){document.querySelectorAll(".rtTimer").forEach(el=>{if(feedTimer)el.textContent=mmss(Date.now()-feedTimer.start);});}
function bindRoutine(root){
  root.querySelector("#rtClose").onclick=()=>{rtOpenNow=false;closeSheet();};
  root.querySelector("#rtFinish").onclick=()=>{if(feedTimer)stopFeed();rt=null;rtSave();rtOpenNow=false;closeSheet();toast("Routine finished");};
  root.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.rt;
    if(a==="start1"||a==="start2"){const side=a==="start1"?rt.first:rt.second;rtOpenNow=false;
      sleepGuard(()=>{if(feedTimer&&feedTimer.side!==side)stopFeed(side);else startFeed(side);openRoutine();});return;}
    if(a==="stop1"||a==="stop2"){stopFeed();}
    else if(a==="switch"){stopFeed(rt.second);}
    else if(a==="burp1"||a==="burp2"||a==="settle"){rt[a]=true;}
    else if(a==="dry"){rt.dry=true;}
    else if(a==="skiptop"){rt.skipTop=true;}
    else if(a==="wet"||a==="dirty"||a==="both"){quickLog("poop",{kind:a});}
    else if(a==="bottle"){rtReturn=true;rtOpenNow=false;bottleSheet();return;}
    rtSave();renderRoutine(false);
  });
}

  let cur={};try{cur=JSON.parse(localStorage.getItem("nasiCurrent")||"{}");}catch(e){}
  code=cur.code&&families.some(f=>f.code===cur.code)?cur.code:(families[0]?.code||"");babyId=cur.code===code?cur.baby||null:null;
}

async function openFamily(c,bid){

  const c=(h.match(/c=([\w-]+)/)||[])[1];
  if(c){try{history.replaceState(null,"",location.pathname);}catch(e){}
    if(c===code){toast(`Already viewing ${family?family.name:"this family"}`);return;}
    if(await openFamily(c,null)){hideHome();toast(`Switched to ${family.name}`);}}
});
})();
</script>
